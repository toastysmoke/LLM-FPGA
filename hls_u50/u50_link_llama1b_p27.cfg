# v++ link config for the 27-port x 8-lane U50 kernel (hls_config_llama1b_p27.cfg), per-port weight layout (sw/split_ports.py --ports 27).
# HBM has 32 pseudo channels: port 0 (header, embedding, own rows) HBM[0:4]; ports 1..26 one channel each HBM[5]..HBM[30]; state and tokens share HBM[31].

[connectivity]
nk=llm_top:1:llm_top_1

sp=llm_top_1.weights:HBM[0:4]
sp=llm_top_1.weights1:HBM[5]
sp=llm_top_1.weights2:HBM[6]
sp=llm_top_1.weights3:HBM[7]
sp=llm_top_1.weights4:HBM[8]
sp=llm_top_1.weights5:HBM[9]
sp=llm_top_1.weights6:HBM[10]
sp=llm_top_1.weights7:HBM[11]
sp=llm_top_1.weights8:HBM[12]
sp=llm_top_1.weights9:HBM[13]
sp=llm_top_1.weights10:HBM[14]
sp=llm_top_1.weights11:HBM[15]
sp=llm_top_1.weights12:HBM[16]
sp=llm_top_1.weights13:HBM[17]
sp=llm_top_1.weights14:HBM[18]
sp=llm_top_1.weights15:HBM[19]
sp=llm_top_1.weights16:HBM[20]
sp=llm_top_1.weights17:HBM[21]
sp=llm_top_1.weights18:HBM[22]
sp=llm_top_1.weights19:HBM[23]
sp=llm_top_1.weights20:HBM[24]
sp=llm_top_1.weights21:HBM[25]
sp=llm_top_1.weights22:HBM[26]
sp=llm_top_1.weights23:HBM[27]
sp=llm_top_1.weights24:HBM[28]
sp=llm_top_1.weights25:HBM[29]
sp=llm_top_1.weights26:HBM[30]
sp=llm_top_1.state:HBM[31]
sp=llm_top_1.tokens:HBM[31]

[vivado]
prop=run.impl_1.STRATEGY=Performance_NetDelay_high
