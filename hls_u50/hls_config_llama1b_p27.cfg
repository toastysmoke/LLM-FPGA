# U50 / Vitis HLS config for the llm_top kernel (27 ports x 8 lanes). Compile to an .xo, then link with u50_link_llama1b_p27.cfg (see ../README.md).
# Part: Alveo U50 = XCU50-FSVH2104-2-E (VU35P with HBM).
part=xcu50-fsvh2104-2-e

[hls]
flow_target=vitis
# 5 ns = 200 MHz target; the Vitis flow retargets the kernel clock at link time (207 MHz achieved).
clock=3.3ns
syn.file=../sw/llm_kernel.cpp
syn.top=llm_top
# NOTE (2026-11-13): `syn.op=op:fadd impl:fulldsp latency:4` was tried and changed nothing: HLS warns "Cannot meet target clock period in
# 'fadd' (7.379 ns) to honor II=1" in the rmsnorm and row_stream loops, because it treats the running-total shift register as a
# distance-1 recurrence. Fixing that needs a kernel change (see CLAUDE.md), so the U50 build stays at about 8 ns / 125 MHz for now.
# Packages the kernel as an .xo for v++ -l. Needed by the link step.
package.output.format=xo
package.output.syn=false
# Kernel build settings (match fit_check.py / kernel_plan.py). Defaults are LLM_LANES=1, LLM_PORTS=1; edit this line to change them.
# ACC_DEPTH / VEC_SUMS = 4 is what kernel_plan.py uses: a float add takes ~4 cycles, so one running total cannot take a new value every
# cycle (the first U50 synth, with defaults of 1, estimated 15.4 ns = 65 MHz). VEC_SUMS changes the sums in the last digits.
syn.cflags=-DLLM_MAX_DIM=2048 -DLLM_MAX_HIDDEN=8192 -DLLM_MAX_SEQ=2048 -DLLM_MAX_HEADS=32 -DLLM_MAX_HEAD_SIZE=64 -DLLM_PORTS=27 -DLLM_LANES=8 -DLLM_ACC_DEPTH=8 -DLLM_LANES_ATT=16 -DLLM_ACC_DEPTH_ATT=8 -DLLM_VEC_SUMS=8
tb.file=../sw/tb_kernel.cpp
tb.file=../sw/llm.c
csim.argv=model/tiny.flat 12 build/logits.bin 1 5 9

